<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stackGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#daa520;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#b8733d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b4513;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Stack of 5 cards/layers representing the 5-deep questions -->
  <rect x="4" y="24" width="20" height="3" rx="1" fill="url(#stackGradient)" stroke="#654321" stroke-width="0.5"/>
  <rect x="5" y="20" width="20" height="3" rx="1" fill="url(#stackGradient)" stroke="#654321" stroke-width="0.5"/>
  <rect x="6" y="16" width="20" height="3" rx="1" fill="url(#stackGradient)" stroke="#654321" stroke-width="0.5"/>
  <rect x="7" y="12" width="20" height="3" rx="1" fill="url(#stackGradient)" stroke="#654321" stroke-width="0.5"/>
  <rect x="8" y="8" width="20" height="3" rx="1" fill="url(#stackGradient)" stroke="#654321" stroke-width="0.5"/>
  
  <!-- Question mark on top card to indicate trivia -->
  <text x="18" y="10.5" font-family="serif" font-size="2.5" font-weight="bold" fill="#2a1810" text-anchor="middle">?</text>
  
  <!-- Small depth indicator dots -->
  <circle cx="29" cy="10" r="0.8" fill="#daa520"/>
  <circle cx="29" cy="13" r="0.8" fill="#b8733d"/>
  <circle cx="29" cy="16" r="0.8" fill="#a0522d"/>
  <circle cx="29" cy="19" r="0.8" fill="#8b4513"/>
  <circle cx="29" cy="22" r="0.8" fill="#654321"/>
</svg>
