<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Dark background circle -->
  <circle cx="128" cy="128" r="128" fill="#1a1a1a"/>
  
  <!-- Stack of 5 knowledge layers - high resolution version -->
  <rect x="48" y="176" width="160" height="20" rx="8" fill="#654321" filter="url(#shadow)"/>
  <rect x="48" y="152" width="144" height="20" rx="8" fill="#8b4513" filter="url(#shadow)"/>
  <rect x="48" y="128" width="128" height="20" rx="8" fill="#a0522d" filter="url(#shadow)"/>
  <rect x="48" y="104" width="112" height="20" rx="8" fill="#cd853f" filter="url(#shadow)"/>
  <rect x="48" y="80" width="96" height="20" rx="8" fill="url(#goldGrad)" filter="url(#shadow)"/>
  
  <!-- Question mark on top layer -->
  <text x="96" y="96" font-family="Times, serif" font-size="24" font-weight="bold" fill="#1a1a1a" text-anchor="middle">?</text>
  
  <!-- Depth indicator on the side -->
  <circle cx="220" cy="90" r="6" fill="#ffd700"/>
  <circle cx="220" cy="114" r="6" fill="#cd853f"/>
  <circle cx="220" cy="138" r="6" fill="#a0522d"/>
  <circle cx="220" cy="162" r="6" fill="#8b4513"/>
  <circle cx="220" cy="186" r="6" fill="#654321"/>
</svg>
