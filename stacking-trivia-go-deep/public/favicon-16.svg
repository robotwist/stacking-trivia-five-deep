  <rect x="2" y="8" width="10" height="2" fill="#a0522d"/>
  <rect x="2" y="5" width="8" height="2" fill="#ffd700"/>
  
  <!-- Tiny question mark -->
  <circle cx="6" cy="6" r="1" fill="#1a1a1a"/>
</svg>
