[build]
  command = "npm run build"
  publish = "dist"
  # Each production deploy costs credits, so skip builds when nothing players see has changed
  # (docs, tests, tooling). Exit 0 = skip, exit 1 = build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public index.html package.json package-lock.json vite.config.js tailwind.config.js postcss.config.js ':(exclude)src/**/__tests__/**'"

[build.environment]
  # Vite 7 requires Node 20.19+
  NODE_VERSION = "22"
  VITE_API_BASE_URL = "https://quizzical-cherry-production.up.railway.app"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build output never changes, so it can be cached forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker and app shell must always be revalidated or updates never reach players
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"
