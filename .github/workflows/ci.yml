name: CI

on:
  push:
    branches: [main, master, production-build]
  pull_request:
    branches: [main, master, production-build]

defaults:
  run:
    working-directory: stacking-trivia-go-deep

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: stacking-trivia-go-deep/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (content-quality core)
        run: npm run lint:quality

      - name: Validate playable stacks
        run: npm run validate:stacks

      - name: Unit tests
        run: npm run test:run

      - name: Production build
        run: npm run build
